name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # dtolnay/rust-toolchain does not read rust-toolchain.toml, and installing a
      # different toolchain than the one rustup then switches to would leave the
      # requested components/targets behind. Feed it the pinned channel instead.
      - name: Read pinned toolchain
        id: rust
        shell: bash
        run: sed -n 's/^channel *= *"\(.*\)"/ver=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.ver }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Frontend lint + typecheck
        run: cd frontend && npm run lint

      - name: Frontend tests
        run: cd frontend && npm run test

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Tests
        run: cargo test
